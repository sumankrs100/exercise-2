# Database configuration
postgres:
  host: localhost
  port: 5432
  user: postgres
  # password: set via environment variable POSTGRES_PASSWORD
  db: webex_recordings

# MinIO configuration
minio:
  endpoint: localhost:9000
  # access_key: set via environment variable MINIO_ACCESS_KEY
  # secret_key: set via environment variable MINIO_SECRET_KEY
  bucket_name: webex-recordings
  secure: true

# Webex configuration
webex:
  # site_url: set via environment variable WEBEX_SITE_URL
  # api_key: set via environment variable WEBEX_API_KEY

# Batch job configuration
batch_job:
  interval_minutes: 60

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Prefect configuration
prefect:
  api_url: http://localhost:4200/api